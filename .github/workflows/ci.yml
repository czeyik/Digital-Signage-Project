name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and audit tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==83.0.0
          python -m pip install --editable '.[dev]' pip-audit==2.10.1
      - name: Lint
        working-directory: backend
        run: python -m ruff check --no-cache .
      - name: Django checks and migrations
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DJANGO_SETTINGS_MODULE: config.settings
        run: python -m pytest -p pytest_django.plugin
      - name: Test bounded worker root initialization
        run: bash backend/signage/tests/test_worker_root_init.sh
      - name: Dependency vulnerability audit
        working-directory: backend
        run: python -m pip_audit --skip-editable

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: signage
          POSTGRES_USER: signage
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signage -d signage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==83.0.0
          python -m pip install --editable '.[dev]'
      - name: PostgreSQL migrations and tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://signage:postgres-ci-only@127.0.0.1:5432/signage
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python -m pytest -p pytest_django.plugin

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build verification image
        run: docker build -f android-player/Dockerfile.build -t duducar-android-build android-player
      - name: Android tests, lint, compile, APK, and fail-closed variants
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/android-player",target=/source,readonly \
            --tmpfs /workspace:exec,size=3g \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -w /workspace duducar-android-build /bin/bash -lc '
              set -eu
              cp -a /source/. /workspace/
              rm -rf /workspace/app/build /workspace/build /workspace/.gradle /workspace/.kotlin
              ./gradlew testDevelopmentDebugUnitTest lintDevelopmentDebug :app:assembleDevelopmentDebug :app:compileDevelopmentDebugAndroidTestKotlin --no-daemon
              if ./gradlew :app:assembleProductionRelease --no-daemon; then
                echo "Unsigned or unconfigured production release unexpectedly succeeded" >&2
                exit 1
              fi
              keytool -genkeypair -noprompt \
                -keystore /tmp/dudu-ci-signing.jks \
                -storepass ci-signing-only \
                -keypass ci-signing-only \
                -alias duducar-ci \
                -keyalg RSA -keysize 3072 -validity 2 \
                -dname "CN=DUDU CI,OU=Build Verification,O=DUDU Car,C=MY"
              export DUDU_SIGNING_STORE_FILE=/tmp/dudu-ci-signing.jks
              export DUDU_SIGNING_STORE_PASSWORD=ci-signing-only
              export DUDU_SIGNING_KEY_ALIAS=duducar-ci
              export DUDU_SIGNING_KEY_PASSWORD=ci-signing-only
              ./gradlew lintProductionRelease :app:assembleProductionRelease \
                -PproductionApiBaseUrl=https://api.marketing.duducaradmin.com/api/v1/ \
                -PplayIntegrityProjectNumber=123456789012 \
                -PpreviousProductionVersionCode=1 \
                -PproductionVersionCode=2 \
                -PproductionVersionName=1.0.1 \
                --no-daemon
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
                app/build/outputs/apk/production/release/app-production-release.apk
              if ./gradlew :app:assembleDevelopmentDebug -PdevelopmentApiBaseUrl=https://api.marketing.duducaradmin.com/api/v1/ --no-daemon; then
                echo "Development build unexpectedly accepted the production API" >&2
                exit 1
              fi
              if ./gradlew :app:assembleDevelopmentDebug -PdevelopmentApiBaseUrl=https://api.marketing.duducaradmin.com./api/v1/ --no-daemon; then
                echo "Development build unexpectedly accepted trailing-dot production API" >&2
                exit 1
              fi
              if ./gradlew :app:assembleDevelopmentDebug -PdevelopmentApiBaseUrl=http://api.example-development.invalid/api/v1/ --no-daemon; then
                echo "Development build unexpectedly accepted non-loopback cleartext API" >&2
                exit 1
              fi
              if ./gradlew :app:assembleDevelopmentDebug -PdevelopmentApiBaseUrl="http://api.example-development.invalid/a b/" --no-daemon; then
                echo "Development build unexpectedly accepted a malformed API URL" >&2
                exit 1
              fi
              if ./gradlew :app:assembleDevelopmentDebug -PdevelopmentApiBaseUrl=ftp://api.example-development.invalid/api/v1/ --no-daemon; then
                echo "Development build unexpectedly accepted a non-HTTP(S) API URL" >&2
                exit 1
              fi
            '

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -check -recursive infrastructure
      - name: Validate bootstrap
        working-directory: infrastructure/bootstrap
        run: terraform init -backend=false && terraform validate
      - name: Validate production stack
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false
          terraform validate
          terraform test
          bash ./test-user-data-size.sh
      - name: Validate isolated recovery smoke and helper guardrails
        working-directory: infrastructure/recovery-smoke
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate
          bash ./test-static-guardrails.sh
          bash ./test-recovery-terraform-wrapper.sh
          bash ./test-recovery-logical-restore.sh
          bash ./test-recovery-loopback-proxy.sh
          bash ./test-recovery-media-query.sh
          bash ./test-recovery-mount-journal-replay.sh
          bash ./test-user-data-size.sh
      - name: Test atomic production release configuration manager
        run: sudo bash infrastructure/terraform/ec2/runtime/test-manage-release-config.sh
      - name: Test complete production runtime bundle manager
        run: sudo bash infrastructure/terraform/ec2/runtime/test-manage-runtime-assets.sh
      - name: Test production runtime credential and lifecycle guardrails
        working-directory: infrastructure/terraform/ec2/runtime
        run: |
          bash ./test-runtime-guardrails.sh
          python3 ./test-credential-broker.py
          python3 ./test-backup-verifier.py
          bash ./test-duducar-stack.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Verify backend Docker build-context exclusions
        run: bash backend/signage/tests/test_docker_build_context.sh
      - name: Build production-architecture backend image
        run: >-
          docker buildx build
          --platform linux/arm64
          --load
          -t duducar-signage-backend:ci
          backend
      - name: Build hardened production-architecture base images
        run: |
          docker buildx build --platform linux/arm64 --load \
            -t duducar-caddy-hardened:ci infrastructure/images/caddy
          docker buildx build --platform linux/arm64 --load \
            -t duducar-postgres-hardened:ci infrastructure/images/postgres
      - name: Inspect and exercise ARM64 images
        run: |
          for image in duducar-signage-backend:ci duducar-caddy-hardened:ci duducar-postgres-hardened:ci; do
            architecture="$(docker image inspect --format '{{.Architecture}}' "$image")"
            if [ "$architecture" != "arm64" ]; then
              echo "Expected ARM64 image, received $architecture for $image" >&2
              exit 1
            fi
          done
          docker run --rm --platform linux/arm64 \
            -e DJANGO_SECRET_KEY=ci-container-check-secret \
            duducar-signage-backend:ci \
            python manage.py check
          docker run --rm --platform linux/arm64 \
            duducar-signage-backend:ci \
            python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pip', 'setuptools', 'ensurepip'))"
          test "$(docker run --rm --platform linux/arm64 duducar-caddy-hardened:ci caddy version)" = v2.11.4-dudu.1
          docker run --rm --platform linux/arm64 \
            --read-only \
            --tmpfs /config \
            --tmpfs /data \
            --mount type=bind,source="$PWD/infrastructure/terraform/ec2/runtime/Caddyfile.post-cutover",target=/etc/caddy/Caddyfile,readonly \
            duducar-caddy-hardened:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          postgres_volume=duducar-postgres-hardened-ci
          init_container=duducar-postgres-hardened-ci-init
          restart_container=duducar-postgres-hardened-ci-restart
          cleanup() {
            docker stop "$init_container" "$restart_container" >/dev/null 2>&1 || true
            docker volume rm "$postgres_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          wait_for_postgres() {
            local name=$1
            for _ in {1..30}; do
              if docker exec "$name" pg_isready -U signage -d signage >/dev/null 2>&1; then
                return
              fi
              sleep 2
            done
            docker logs "$name" >&2
            return 1
          }
          docker volume create "$postgres_volume" >/dev/null
          docker run -d --rm --name "$init_container" --platform linux/arm64 \
            -e POSTGRES_DB=signage \
            -e POSTGRES_USER=signage \
            -e POSTGRES_PASSWORD=postgres-ci-only \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            -v "$postgres_volume":/var/lib/postgresql/data \
            duducar-postgres-hardened:ci >/dev/null
          wait_for_postgres "$init_container"
          docker exec "$init_container" sh -ec 'test "$(id -u postgres)" = 70; test "$(cat "$PGDATA/PG_VERSION")" = 16; test "$(stat -c %u "$PGDATA")" = 70'
          docker exec "$init_container" gosu postgres sh -ec 'test "$(id -u):$(id -g)" = 70:70'
          docker exec "$init_container" gosu --version | grep -F go1.26.6
          docker exec "$init_container" psql -U signage -d signage -c 'CREATE TABLE canary_probe (id integer primary key); INSERT INTO canary_probe VALUES (1);' >/dev/null
          docker stop "$init_container" >/dev/null
          docker run -d --rm --name "$restart_container" --platform linux/arm64 \
            -e POSTGRES_DB=signage \
            -e POSTGRES_USER=signage \
            -e POSTGRES_PASSWORD=postgres-ci-only \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            -v "$postgres_volume":/var/lib/postgresql/data \
            duducar-postgres-hardened:ci >/dev/null
          wait_for_postgres "$restart_container"
          test "$(docker exec "$restart_container" psql -U signage -d signage -tAc 'SELECT count(*) FROM canary_probe')" = 1
      - name: Scan backend container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: duducar-signage-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Scan hardened Caddy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: duducar-caddy-hardened:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Scan hardened PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: duducar-postgres-hardened:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
