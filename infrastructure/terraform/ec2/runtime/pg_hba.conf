# Unix-socket access is local to the PostgreSQL container.
local   all       all                       trust

# The non-superuser Django role may connect from the Docker bridge and isolated
# ECS workers. The non-superuser schema owner is limited to one-off migration
# containers on the local Docker bridge. AWS Security Groups further restrict
# port 5432 to the worker security group.
hostssl signage   signage_app     172.16.0.0/12   scram-sha-256
hostssl signage   signage_app     10.40.0.0/16    scram-sha-256
hostssl signage   signage_owner   172.16.0.0/12   scram-sha-256

# Reject every plaintext and unapproved host connection explicitly.
host    all       all       0.0.0.0/0       reject
host    all       all       ::/0            reject
